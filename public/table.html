<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>karaoke-queue</title>
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #111111;
    --ink-2: #4a4a4a;
    --rule: #d9d9d9;
    --red: #c8102e;
    --red-dark: #9e0c24;
    --stand-in: #e6e6e6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 20px 18px 48px;
    max-width: 720px;
    margin-inline: auto;
    font-variant-numeric: tabular-nums;
  }
  h2 {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 6px;
    padding-bottom: 6px;
    border-bottom: 3px solid var(--ink);
  }
  .thumb {
    background: var(--stand-in);
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }
  .now-playing { padding: 14px 0 22px; }
  .now-playing .title-row { display: flex; align-items: center; gap: 14px; }
  .now-playing .thumb { width: 112px; height: 84px; }
  .now-playing .title { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
  .now-playing .empty { color: var(--ink-2); }
  ol#queue-list { list-style: none; margin: 0 0 20px; padding: 0; }
  ol#queue-list li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  ol#queue-list li .thumb { width: 64px; height: 48px; }
  .position {
    font-weight: 700;
    font-size: 1.3rem;
    min-width: 2.2rem;
    text-align: center;
  }
  ol#queue-list li.mine .position { background: var(--red); color: #fff; padding: 2px 0; }
  .yours { margin-inline-start: auto; color: var(--red); font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
  #empty-queue { color: var(--ink-2); padding: 8px 0 20px; margin: 0; }
  #mine-panel { padding: 14px 16px; border: 2px solid var(--red); margin-bottom: 16px; }
  #mine-panel p { margin: 0 0 12px; font-weight: 700; }
  form#request-form { display: flex; flex-direction: column; gap: 10px; }
  input[type="text"] {
    font: inherit;
    font-size: 1.05rem;
    padding: 14px;
    border: 2px solid var(--ink);
    border-radius: 0;
    background: var(--paper);
    color: var(--ink);
  }
  button {
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 14px;
    min-height: 48px;
    border-radius: 0;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  button.primary { background: var(--ink); color: #fff; border: 2px solid var(--ink); }
  button.primary:hover { background: #333; }
  button.cancel { background: var(--paper); color: var(--red); border: 2px solid var(--red); }
  button.cancel:hover { background: #fdf1f3; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .hint { font-size: 0.9rem; color: var(--ink-2); min-height: 1.2em; margin: 0; }
  .hint.error { color: var(--red); }
  .song-preview { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .song-preview .thumb { width: 64px; height: 48px; }
  .song-preview span { font-weight: 700; }
  #status-line { font-weight: 700; margin: 0 0 14px; }
  #price-line { margin: 0 0 18px; }
  form#request-form h2 { margin-bottom: 4px; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
  <h2>Now playing</h2>
  <div class="now-playing" id="now-playing">
    <span class="empty">Nothing playing right now.</span>
  </div>

  <h2>Queue</h2>
  <ol id="queue-list"></ol>
  <p id="empty-queue" hidden>No one is waiting in line.</p>

  <p id="status-line" hidden></p>

  <div id="mine-panel" hidden>
    <p id="mine-status-text">Your song is in the queue.</p>
    <button class="cancel" id="cancel-button">Cancel my request</button>
  </div>

  <p class="hint" id="price-line" hidden></p>

  <form id="request-form">
    <h2><label for="song-input">Request a song</label></h2>
    <input
      type="text"
      id="song-input"
      placeholder="Paste a YouTube link or video ID"
      autocomplete="off"
      autofocus
    />
    <p class="hint" id="input-hint"></p>
    <div class="song-preview" id="song-preview" hidden>
      <img class="thumb" id="preview-thumb" alt="" />
      <span id="preview-title"></span>
    </div>
    <button type="submit" class="primary">Request this song</button>
  </form>

  <script type="module">
    import { extractVideoId } from "/youtube.js";

    const token = location.pathname.split("/").filter(Boolean)[1];
    const nowPlayingEl = document.getElementById("now-playing");
    const queueListEl = document.getElementById("queue-list");
    const emptyQueueEl = document.getElementById("empty-queue");
    const minePanelEl = document.getElementById("mine-panel");
    const priceLineEl = document.getElementById("price-line");
    const formEl = document.getElementById("request-form");
    const inputEl = document.getElementById("song-input");
    const hintEl = document.getElementById("input-hint");
    const cancelButtonEl = document.getElementById("cancel-button");
    const mineStatusTextEl = document.getElementById("mine-status-text");
    const previewEl = document.getElementById("song-preview");
    const previewThumbEl = document.getElementById("preview-thumb");
    const previewTitleEl = document.getElementById("preview-title");
    const statusLineEl = document.getElementById("status-line");
    let statusTimer = null;

    function showStatus(text) {
      statusLineEl.textContent = text;
      statusLineEl.hidden = false;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusLineEl.hidden = true; }, 8000);
    }

    const BLANK_THUMB = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
    // Offline thumbnails fall back to the plain block behind them.
    const thumb = (ref, extra = "") =>
      `<img class="thumb" src="${thumbnailUrl(ref)}" alt="" ${extra} onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='" />`;

    let previewRequestId = 0;

    let myTableId = null;
    let myPricePerUse = null;
    let myCurrencySymbol = "";

    // Static thumbnail, no API key needed.
    function thumbnailUrl(songRef) {
      return `https://img.youtube.com/vi/${songRef}/default.jpg`;
    }

    function render(state) {
      // WS pushes lack tableId; don't blank it out.
      if (state.tableId !== undefined) {
        myTableId = state.tableId;
      }
      if (state.pricePerUse !== undefined) {
        myPricePerUse = state.pricePerUse;
      }
      if (state.currencySymbol !== undefined) {
        myCurrencySymbol = state.currencySymbol;
      }
      priceLineEl.hidden = !(myPricePerUse > 0);
      priceLineEl.textContent = `${myCurrencySymbol}${myPricePerUse} per song, added to your table's bill.`;

      nowPlayingEl.innerHTML = state.nowPlaying
        ? `<div class="title-row">${thumb(state.nowPlaying.songRef)}<span class="title">${escapeHtml(state.nowPlaying.songTitle)}</span></div>`
        : `<span class="empty">Nothing playing right now.</span>`;

      queueListEl.innerHTML = "";
      // Also matches a promoted-to-playing entry.
      const mine =
        state.queued.find((e) => e.tableId === myTableId) ??
        (state.nowPlaying?.tableId === myTableId ? state.nowPlaying : null);

      if (state.queued.length === 0) {
        emptyQueueEl.hidden = false;
      } else {
        emptyQueueEl.hidden = true;
        state.queued.forEach((entry, i) => {
          const li = document.createElement("li");
          const isMine = entry.tableId === myTableId;
          if (isMine) li.classList.add("mine");
          li.innerHTML = `<span class="position">${i + 1}</span>${thumb(entry.songRef)}<span>${escapeHtml(entry.songTitle)}</span>${isMine ? '<span class="yours">Your table</span>' : ""}`;
          queueListEl.appendChild(li);
        });
      }

      if (mine) {
        minePanelEl.hidden = false;
        formEl.hidden = true;
        cancelButtonEl.hidden = false;
        cancelButtonEl.dataset.entryId = mine.id;
        if (mine.status === "playing") {
          mineStatusTextEl.textContent = "Your song is playing now.";
          cancelButtonEl.textContent = "Skip this song";
          cancelButtonEl.dataset.action = "skip";
        } else {
          mineStatusTextEl.textContent = "Your song is in the queue.";
          cancelButtonEl.textContent = "Cancel my request";
          cancelButtonEl.dataset.action = "cancel";
        }
      } else {
        minePanelEl.hidden = true;
        formEl.hidden = false;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadState() {
      const res = await fetch(`/t/${token}/state`);
      render(await res.json());
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}/?table=${encodeURIComponent(token)}`);
      ws.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "queue-state") render(message);
      });
      ws.addEventListener("close", () => {
        setTimeout(connectSocket, 2000);
      });
    }

    async function showPreview(videoId) {
      const requestId = ++previewRequestId;
      previewThumbEl.onerror = () => { previewThumbEl.onerror = null; previewThumbEl.src = BLANK_THUMB; };
      previewThumbEl.src = thumbnailUrl(videoId);
      previewTitleEl.textContent = "Loading title…";
      previewEl.hidden = false;

      try {
        const res = await fetch(`/t/${token}/preview?videoId=${videoId}`);
        const body = await res.json().catch(() => ({}));
        if (requestId !== previewRequestId) return; // input changed since; stale response
        previewTitleEl.textContent = body.title || `YouTube video ${videoId}`;
      } catch {
        if (requestId !== previewRequestId) return;
        previewTitleEl.textContent = "Couldn't load a preview. Check your connection.";
      }
    }

    inputEl.addEventListener("input", () => {
      if (!inputEl.value.trim()) {
        hintEl.textContent = "";
        hintEl.classList.remove("error");
        previewEl.hidden = true;
        return;
      }
      const videoId = extractVideoId(inputEl.value);
      if (videoId) {
        hintEl.textContent = "Looks good.";
        hintEl.classList.remove("error");
        showPreview(videoId);
      } else {
        hintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        hintEl.classList.add("error");
        previewEl.hidden = true;
      }
    });

    const submitButtonEl = formEl.querySelector('button[type="submit"]');

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const videoId = extractVideoId(inputEl.value);
      if (!videoId) {
        hintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        hintEl.classList.add("error");
        return;
      }

      submitButtonEl.disabled = true;
      submitButtonEl.textContent = "Requesting…";
      try {
        let res;
        try {
          res = await fetch(`/t/${token}/queue`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // If YouTube can't be reached for the real title, a pasted URL makes a poor queue line.
            body: JSON.stringify({ title: `YouTube video ${videoId}`, songRef: videoId }),
          });
        } catch {
          hintEl.textContent = "Couldn't reach the server. Check your connection and try again.";
          hintEl.classList.add("error");
          return;
        }

        if (res.status === 409) {
          hintEl.textContent = "This table already has a request in.";
          hintEl.classList.add("error");
          return;
        }
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          hintEl.textContent = body.error || "Something went wrong. Try again.";
          hintEl.classList.add("error");
          return;
        }

        inputEl.value = "";
        hintEl.textContent = "";
        hintEl.classList.remove("error");
        previewEl.hidden = true;
      } finally {
        submitButtonEl.disabled = false;
        submitButtonEl.textContent = "Request this song";
      }
    });

    cancelButtonEl.addEventListener("click", async () => {
      const entryId = cancelButtonEl.dataset.entryId;
      cancelButtonEl.disabled = true;
      try {
        if (cancelButtonEl.dataset.action === "skip") {
          const res = await fetch(`/t/${token}/queue/${entryId}/skip`, { method: "POST" });
          const body = await res.json();
          // The panel closes as soon as the queue updates, so the result goes in a line that stays.
          showStatus(body.billable
            ? "Skipped. This still counts toward your bill."
            : "Skipped. Not charged, since you caught it in the first 15 seconds.");
          return;
        }
        await fetch(`/t/${token}/queue/${entryId}`, { method: "DELETE" });
      } finally {
        cancelButtonEl.disabled = false;
      }
    });

    loadState();
    connectSocket();
  </script>
</body>
</html>
