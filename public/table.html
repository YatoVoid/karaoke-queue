<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>karaoke-queue</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #6ee7ff;
    --text: #e8ecf1;
    --text-dim: #9aa3b2;
    --danger: #ff6e6e;
  }
  * { box-sizing: border-box; }
  /* The [hidden] attribute is only honored via the UA stylesheet at very
     low specificity — any element-specific `display` rule below (e.g.
     `form#request-form { display: flex }`) silently wins over it. Force
     it to actually work regardless of what else targets the element. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
    /* Without this, content stretches full-bleed on a large/wide
       display (a real monitor, or a browser window maximized on one) —
       inputs and buttons spanning 3000+ px look lost and unreadable.
       Matches admin.html's existing max-width, for visual consistency
       across the whole product too. */
    max-width: 720px;
    margin-inline: auto;
  }
  h1 { font-size: 1.1rem; color: var(--text-dim); font-weight: 600; margin: 0 0 4px; }
  .now-playing {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .now-playing .title { font-size: 1.4rem; font-weight: 700; }
  .now-playing .empty { color: var(--text-dim); }
  ol#queue-list {
    list-style: none;
    margin: 0 0 24px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ol#queue-list li {
    background: var(--panel);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  ol#queue-list li img {
    width: 64px;
    height: 48px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .now-playing .title-row { display: flex; align-items: center; gap: 12px; }
  .now-playing img { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; }
  ol#queue-list li.mine { outline: 2px solid var(--accent); }
  .position {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.5em;
  }
  #empty-queue { color: var(--text-dim); font-style: italic; }
  form#request-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  input[type="text"] {
    font-size: 1rem;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #0b0d11;
    color: var(--text);
  }
  button {
    font-size: 1rem;
    font-weight: 700;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #062024; }
  button.cancel { background: var(--danger); color: #2a0505; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 0.85rem; color: var(--text-dim); min-height: 1.2em; }
  .hint.error { color: var(--danger); }
</style>
</head>
<body>
  <h1>Now playing</h1>
  <div class="now-playing" id="now-playing">
    <span class="empty">Nothing playing right now.</span>
  </div>

  <h1>Queue</h1>
  <ol id="queue-list"></ol>
  <p id="empty-queue" hidden>No one is waiting in line.</p>

  <div id="mine-panel" hidden>
    <p id="mine-status-text">Your song is in the queue.</p>
    <button class="cancel" id="cancel-button">Cancel my request</button>
  </div>

  <p class="hint" id="price-line" hidden></p>

  <form id="request-form">
    <input
      type="text"
      id="song-input"
      placeholder="Paste a YouTube link or video ID"
      autocomplete="off"
    />
    <p class="hint" id="input-hint"></p>
    <button type="submit" class="primary">Request this song</button>
  </form>

  <script type="module">
    import { extractVideoId } from "/youtube.js";

    const token = location.pathname.split("/").filter(Boolean)[1];
    const nowPlayingEl = document.getElementById("now-playing");
    const queueListEl = document.getElementById("queue-list");
    const emptyQueueEl = document.getElementById("empty-queue");
    const minePanelEl = document.getElementById("mine-panel");
    const priceLineEl = document.getElementById("price-line");
    const formEl = document.getElementById("request-form");
    const inputEl = document.getElementById("song-input");
    const hintEl = document.getElementById("input-hint");
    const cancelButtonEl = document.getElementById("cancel-button");
    const mineStatusTextEl = document.getElementById("mine-status-text");

    let myTableId = null;
    let myPricePerUse = null;

    // The server fetches the real YouTube title via the official,
    // keyless oEmbed endpoint whenever it can (see src/youtube.js's
    // fetchOembedTitle) — the raw pasted text is only ever shown as a
    // fallback if that lookup fails. Thumbnails are always YouTube's
    // static images, which need no key either way.
    function thumbnailUrl(songRef) {
      return `https://img.youtube.com/vi/${songRef}/default.jpg`;
    }

    function render(state) {
      // WebSocket broadcasts are venue-wide (one shared message for every
      // connected client, regardless of which table they are), so they
      // never carry a viewer-specific tableId — only the initial
      // GET /t/:token/state response does. Only set myTableId when the
      // incoming payload actually has one; a WS push must never blank out
      // an already-known identity.
      if (state.tableId !== undefined) {
        myTableId = state.tableId;
      }
      if (state.pricePerUse !== undefined) {
        myPricePerUse = state.pricePerUse;
      }
      priceLineEl.hidden = !(myPricePerUse > 0);
      priceLineEl.textContent = `This costs ${myPricePerUse} — ask staff to add it to your bill.`;

      nowPlayingEl.innerHTML = state.nowPlaying
        ? `<div class="title-row"><img src="${thumbnailUrl(state.nowPlaying.songRef)}" alt="" /><span class="title">${escapeHtml(state.nowPlaying.songTitle)}</span></div>`
        : `<span class="empty">Nothing playing right now.</span>`;

      queueListEl.innerHTML = "";
      // "mine" must also match a request that's been promoted to
      // 'playing' — once the player advances it, it's removed from
      // state.queued entirely (queuedList only returns status='queued'
      // rows), so checking queued alone would wrongly show the request
      // form again while this table's own song is the one playing.
      const mine =
        state.queued.find((e) => e.tableId === myTableId) ??
        (state.nowPlaying?.tableId === myTableId ? state.nowPlaying : null);

      if (state.queued.length === 0) {
        emptyQueueEl.hidden = false;
      } else {
        emptyQueueEl.hidden = true;
        state.queued.forEach((entry, i) => {
          const li = document.createElement("li");
          if (entry.tableId === myTableId) li.classList.add("mine");
          li.innerHTML = `<span class="position">${i + 1}</span><img src="${thumbnailUrl(entry.songRef)}" alt="" /><span>${escapeHtml(entry.songTitle)}</span>`;
          queueListEl.appendChild(li);
        });
      }

      if (mine) {
        minePanelEl.hidden = false;
        formEl.hidden = true;
        if (mine.status === "playing") {
          mineStatusTextEl.textContent = "Your song is playing now!";
          // cancel() only ever removes status='queued' rows (KR1) — a
          // cancel attempt on a playing entry would silently do
          // nothing, so don't offer a button that wouldn't work.
          cancelButtonEl.hidden = true;
        } else {
          mineStatusTextEl.textContent = "Your song is in the queue.";
          cancelButtonEl.hidden = false;
          cancelButtonEl.dataset.entryId = mine.id;
        }
      } else {
        minePanelEl.hidden = true;
        formEl.hidden = false;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadState() {
      const res = await fetch(`/t/${token}/state`);
      render(await res.json());
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "queue-state") render(message);
      });
      ws.addEventListener("close", () => {
        setTimeout(connectSocket, 2000);
      });
    }

    inputEl.addEventListener("input", () => {
      if (!inputEl.value.trim()) {
        hintEl.textContent = "";
        hintEl.classList.remove("error");
        return;
      }
      if (extractVideoId(inputEl.value)) {
        hintEl.textContent = "Looks good.";
        hintEl.classList.remove("error");
      } else {
        hintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        hintEl.classList.add("error");
      }
    });

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const videoId = extractVideoId(inputEl.value);
      if (!videoId) {
        hintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        hintEl.classList.add("error");
        return;
      }

      const res = await fetch(`/t/${token}/queue`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: inputEl.value.trim(), songRef: videoId }),
      });

      if (res.status === 409) {
        hintEl.textContent = "This table already has a request in.";
        hintEl.classList.add("error");
        return;
      }
      if (!res.ok) {
        hintEl.textContent = "Something went wrong — try again.";
        hintEl.classList.add("error");
        return;
      }

      inputEl.value = "";
      hintEl.textContent = "";
      hintEl.classList.remove("error");
    });

    cancelButtonEl.addEventListener("click", async () => {
      const entryId = cancelButtonEl.dataset.entryId;
      await fetch(`/t/${token}/queue/${entryId}`, { method: "DELETE" });
    });

    loadState();
    connectSocket();
  </script>
</body>
</html>
