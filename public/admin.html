<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>karaoke-queue admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f1115;
    color: #e8ecf1;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
    max-width: 720px;
    margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 20px; }
  h2 { font-size: 1rem; color: #9aa3b2; margin: 28px 0 12px; }
  .panel { background: #1a1d24; border-radius: 14px; padding: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #2a2d36; font-size: 0.9rem; }
  th { color: #9aa3b2; font-weight: 600; }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 0.85rem; color: #9aa3b2; }
  input[type="text"], input[type="number"], select {
    font-size: 1rem;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0b0d11;
    color: #e8ecf1;
    width: 100%;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  button {
    font-size: 0.95rem;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #6ee7ff;
    color: #062024;
  }
  button.small { padding: 6px 10px; font-size: 0.85rem; }
  code { background: #0b0d11; padding: 3px 6px; border-radius: 6px; font-size: 0.85rem; }
  .hint { font-size: 0.85rem; color: #9aa3b2; min-height: 1.2em; margin: 0; }
  .hint.error { color: #ff6e6e; }
  #playlist-rows li {
    background: #0b0d11;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>Admin: venue <span id="venue-label"></span></h1>

  <h2>Currency</h2>
  <div class="panel">
    <form id="currency-form">
      <div class="field">
        <label>Symbol shown on every price (e.g. $, &#8380;, AZN)</label>
        <input type="text" id="currency-input" placeholder="$" />
      </div>
      <button type="submit">Save currency</button>
    </form>
  </div>

  <h2>Tables</h2>
  <div class="panel">
    <table>
      <thead>
        <tr><th>Label</th><th>Kind</th><th>Price</th><th>Billed</th><th>Pairing</th><th>Actions</th></tr>
      </thead>
      <tbody id="table-rows"></tbody>
    </table>
    <p id="no-tables" hidden style="color:#6b7280;">No tables yet.</p>
    <p class="hint error" id="table-list-error" hidden></p>
  </div>

  <h2>Add a table</h2>
  <div class="panel">
    <form id="create-form">
      <div class="field">
        <label>Label</label>
        <input type="text" id="label-input" placeholder="Table 5" required />
      </div>
      <div class="row">
        <div class="field">
          <label>Kind</label>
          <select id="kind-input">
            <option value="public">Public (pays per use)</option>
            <option value="private">Private room (free)</option>
          </select>
        </div>
        <div class="field" id="price-field">
          <label>Price per use</label>
          <input type="number" id="price-input" min="0" step="1" value="0" />
        </div>
      </div>
      <p class="hint error" id="table-form-error" hidden></p>
      <button type="submit">Create table</button>
    </form>
  </div>

  <h2>Player</h2>
  <div class="panel">
    <button id="create-player-button">Create player token</button>
    <p id="player-url" hidden></p>
  </div>

  <h2>Background playlist</h2>
  <div class="panel">
    <ol id="playlist-rows" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;"></ol>
    <p id="no-playlist-tracks" hidden style="color:#6b7280;">No playlist tracks yet. The queue falls back to silence when empty.</p>
  </div>

  <h2>Add a playlist track</h2>
  <div class="panel">
    <form id="playlist-form">
      <div class="field">
        <label>Title</label>
        <input type="text" id="playlist-title-input" placeholder="Ambient track" required />
      </div>
      <div class="field">
        <label>YouTube link or video ID</label>
        <input type="text" id="playlist-song-input" placeholder="https://www.youtube.com/watch?v=..." required />
        <p class="hint" id="playlist-input-hint"></p>
      </div>
      <button type="submit">Add track</button>
    </form>
  </div>

  <script type="module">
    import { extractVideoId } from "/youtube.js";

    const venueId = location.pathname.split("/").filter(Boolean)[2];
    // pathname isn't auto-decoded; decode a display-only copy.
    let displayVenueId = venueId;
    try {
      displayVenueId = decodeURIComponent(venueId);
    } catch {
      // Malformed encoding; keep the raw string.
    }
    document.getElementById("venue-label").textContent = displayVenueId;

    const currencyFormEl = document.getElementById("currency-form");
    const currencyInputEl = document.getElementById("currency-input");
    let currencySymbol = "";

    const tableRowsEl = document.getElementById("table-rows");
    const noTablesEl = document.getElementById("no-tables");
    const tableListErrorEl = document.getElementById("table-list-error");
    const createFormEl = document.getElementById("create-form");
    const tableFormErrorEl = document.getElementById("table-form-error");
    const labelInputEl = document.getElementById("label-input");
    const kindInputEl = document.getElementById("kind-input");
    const priceFieldEl = document.getElementById("price-field");
    const priceInputEl = document.getElementById("price-input");
    const createPlayerButtonEl = document.getElementById("create-player-button");
    const playerUrlEl = document.getElementById("player-url");
    const playlistRowsEl = document.getElementById("playlist-rows");
    const noPlaylistTracksEl = document.getElementById("no-playlist-tracks");
    const playlistFormEl = document.getElementById("playlist-form");
    const playlistTitleInputEl = document.getElementById("playlist-title-input");
    const playlistSongInputEl = document.getElementById("playlist-song-input");
    const playlistHintEl = document.getElementById("playlist-input-hint");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function syncPriceFieldVisibility() {
      if (kindInputEl.value === "private") {
        priceFieldEl.hidden = true;
        priceInputEl.value = "0";
      } else {
        priceFieldEl.hidden = false;
      }
    }
    kindInputEl.addEventListener("change", syncPriceFieldVisibility);
    syncPriceFieldVisibility();

    async function loadTables() {
      const res = await fetch(`/admin/venues/${venueId}/tables`);
      const tables = await res.json();

      tableRowsEl.innerHTML = "";
      noTablesEl.hidden = tables.length > 0;

      tables.forEach((t) => {
        const tr = document.createElement("tr");
        const priceText = t.kind === "public" ? `${currencySymbol}${t.pricePerUse}` : "free";
        const billedText =
          t.kind === "public"
            ? `${t.billableCount} (${currencySymbol}${t.billableCount * t.pricePerUse})`
            : String(t.billableCount);
        const pairingCell = t.pairingUrl
          ? `<code>${escapeHtml(t.pairingUrl)}</code>`
          : `<button class="small" data-pair-table-id="${t.id}">Pair</button>`;
        tr.innerHTML = `<td>${escapeHtml(t.label)}</td><td>${t.kind}</td><td>${priceText}</td><td>${billedText}</td><td>${pairingCell}</td><td><button class="small" data-edit-table-id="${t.id}" data-label="${escapeHtml(t.label)}" data-kind="${t.kind}" data-price="${t.pricePerUse}">Edit</button> <button class="small" data-delete-table-id="${t.id}" data-label="${escapeHtml(t.label)}">Delete</button></td>`;
        tableRowsEl.appendChild(tr);
      });

      tableRowsEl.querySelectorAll("[data-pair-table-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const tableId = btn.dataset.pairTableId;
          await fetch(`/admin/venues/${venueId}/tables/${tableId}/pair`, { method: "POST" });
          await loadTables();
        });
      });

      tableRowsEl.querySelectorAll("[data-edit-table-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const tableId = btn.dataset.editTableId;
          const label = window.prompt("Label:", btn.dataset.label);
          if (label === null) return;
          const kind = window.prompt("Kind (public/private):", btn.dataset.kind);
          if (kind === null) return;
          let pricePerUse = Number(btn.dataset.price) || 0;
          if (kind === "public") {
            const priceInput = window.prompt("Price per use:", btn.dataset.price);
            if (priceInput === null) return;
            pricePerUse = Number(priceInput);
          }

          tableListErrorEl.hidden = true;
          const res = await fetch(`/admin/venues/${venueId}/tables/${tableId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ label: label.trim(), kind, pricePerUse }),
          });

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            tableListErrorEl.textContent = body.error || "Something went wrong. Try again.";
            tableListErrorEl.hidden = false;
            return;
          }

          await loadTables();
        });
      });

      tableRowsEl.querySelectorAll("[data-delete-table-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const tableId = btn.dataset.deleteTableId;
          if (!window.confirm(`Delete "${btn.dataset.label}"? This cannot be undone.`)) return;

          tableListErrorEl.hidden = true;
          const res = await fetch(`/admin/venues/${venueId}/tables/${tableId}`, { method: "DELETE" });
          if (!res.ok) {
            tableListErrorEl.textContent = "Something went wrong. Try again.";
            tableListErrorEl.hidden = false;
            return;
          }
          await loadTables();
        });
      });
    }

    async function loadCurrency() {
      const res = await fetch(`/admin/venues/${venueId}/currency`);
      const body = await res.json();
      currencySymbol = body.currencySymbol;
      currencyInputEl.value = currencySymbol;
    }

    currencyFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const res = await fetch(`/admin/venues/${venueId}/currency`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currencySymbol: currencyInputEl.value }),
      });
      const body = await res.json();
      currencySymbol = body.currencySymbol;
      await loadTables();
    });

    createFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const label = labelInputEl.value.trim();
      const kind = kindInputEl.value;
      const pricePerUse = kind === "private" ? 0 : Number(priceInputEl.value) || 0;

      const res = await fetch(`/admin/venues/${venueId}/tables`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label, kind, pricePerUse }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        tableFormErrorEl.textContent = body.error || "Something went wrong. Try again.";
        tableFormErrorEl.hidden = false;
        return;
      }

      tableFormErrorEl.hidden = true;
      labelInputEl.value = "";
      priceInputEl.value = "0";
      await loadTables();
    });

    createPlayerButtonEl.addEventListener("click", async () => {
      const res = await fetch(`/admin/venues/${venueId}/player-token`, { method: "POST" });
      const body = await res.json();
      playerUrlEl.textContent = body.url;
      playerUrlEl.hidden = false;
    });

    async function loadPlaylist() {
      const res = await fetch(`/admin/venues/${venueId}/playlist-tracks`);
      const tracks = await res.json();

      playlistRowsEl.innerHTML = "";
      noPlaylistTracksEl.hidden = tracks.length > 0;

      tracks.forEach((track) => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${escapeHtml(track.title)}</span><button class="small" data-remove-track-id="${track.id}">Remove</button>`;
        playlistRowsEl.appendChild(li);
      });

      playlistRowsEl.querySelectorAll("[data-remove-track-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const trackId = btn.dataset.removeTrackId;
          await fetch(`/admin/venues/${venueId}/playlist-tracks/${trackId}`, { method: "DELETE" });
          await loadPlaylist();
        });
      });
    }

    playlistSongInputEl.addEventListener("input", () => {
      if (!playlistSongInputEl.value.trim()) {
        playlistHintEl.textContent = "";
        playlistHintEl.classList.remove("error");
        return;
      }
      if (extractVideoId(playlistSongInputEl.value)) {
        playlistHintEl.textContent = "Looks good.";
        playlistHintEl.classList.remove("error");
      } else {
        playlistHintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        playlistHintEl.classList.add("error");
      }
    });

    playlistFormEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = playlistTitleInputEl.value.trim();
      const videoId = extractVideoId(playlistSongInputEl.value);
      if (!videoId) {
        playlistHintEl.textContent = "Doesn't look like a YouTube link or video ID.";
        playlistHintEl.classList.add("error");
        return;
      }

      const res = await fetch(`/admin/venues/${venueId}/playlist-tracks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, songRef: videoId }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        playlistHintEl.textContent = body.error || "Something went wrong. Try again.";
        playlistHintEl.classList.add("error");
        return;
      }

      playlistTitleInputEl.value = "";
      playlistSongInputEl.value = "";
      playlistHintEl.textContent = "";
      playlistHintEl.classList.remove("error");
      await loadPlaylist();
    });

    loadCurrency().then(loadTables);
    loadPlaylist();
  </script>
</body>
</html>
