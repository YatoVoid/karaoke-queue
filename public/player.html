<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>karaoke-queue player</title>
<style>
  :root { color-scheme: dark; --black: #000; --ink: #f4f4f4; --ink-2: #a8a8a8; --rule: #333; --red: #e0203d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    background: var(--black);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  #player-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #yt-player-wrap { flex: 1; background: #1c1c1c; min-height: 0; }
  #yt-player { width: 100%; height: 100%; }
  #idle-message {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--ink-2);
    text-align: center;
    padding: 20px;
  }
  #sidebar {
    width: 340px;
    flex-shrink: 0;
    padding: 28px 24px;
    overflow-y: auto;
    border-left: 1px solid var(--rule);
  }
  #sidebar h2 {
    font-size: 1.1rem;
    margin: 0 0 4px;
    padding-bottom: 8px;
    border-bottom: 3px solid var(--ink);
  }
  @media (max-width: 700px) {
    body { flex-direction: column; height: 100vh; height: 100dvh; }
    #player-column { flex: none; }
    #yt-player-wrap, #idle-message { aspect-ratio: 16 / 9; flex: none; font-size: 1.4rem; }
    #sidebar { width: 100%; flex: 1; min-height: 0; border-left: 0; }
  }
  ol#side-queue { list-style: none; margin: 0; padding: 0; }
  ol#side-queue li {
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 1.1rem;
    display: flex;
    gap: 14px;
    align-items: baseline;
  }
  ol#side-queue li .position { font-weight: 700; font-size: 1.5rem; min-width: 2rem; }
  ol#side-queue li:first-child .position { color: #f0475e; }
  #side-empty { color: var(--ink-2); font-size: 1.1rem; margin: 12px 0 0; }
  #banner-stack { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; flex-direction: column; }
  #connection-banner, #skip-banner { font-weight: 700; text-align: center; padding: 8px; font-size: 1rem; }
  #connection-banner { background: var(--red); color: #fff; }
  #skip-banner { background: var(--ink); color: var(--black); }
</style>
</head>
<body>
  <div id="banner-stack">
    <div id="connection-banner" hidden>Reconnecting to the server…</div>
    <div id="skip-banner" hidden>That video can't play here. Moving to the next one.</div>
  </div>
  <div id="player-column">
    <div id="idle-message" hidden>Waiting for the first song</div>
    <div id="yt-player-wrap" hidden><div id="yt-player"></div></div>
  </div>
  <div id="sidebar">
    <h2>Up next</h2>
    <ol id="side-queue"></ol>
    <p id="side-empty" hidden>Nothing waiting. Request a song from your table.</p>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module">
    const token = location.pathname.split("/").filter(Boolean)[1];
    const connectionBannerEl = document.getElementById("connection-banner");
    const skipBannerEl = document.getElementById("skip-banner");
    let skipBannerTimeout = null;
    const ytWrapEl = document.getElementById("yt-player-wrap");
    const idleEl = document.getElementById("idle-message");
    const sideQueueEl = document.getElementById("side-queue");
    const sideEmptyEl = document.getElementById("side-empty");

    let ytPlayer = null;
    let ytReady = false;
    let pendingVideo = null;
    let currentVideoId = null;
    let currentIsBackground = false;
    const backgroundResumeAt = new Map();

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingVideo) {
              ytPlayer.loadVideoById(pendingVideo);
              pendingVideo = null;
            }
          },
          onStateChange: onPlayerStateChange,
          // Some videos block embedding; skip instead of getting stuck.
          onError: onPlayerError,
        },
      });
    };

    async function onPlayerError() {
      skipBannerEl.hidden = false;
      clearTimeout(skipBannerTimeout);
      skipBannerTimeout = setTimeout(() => {
        skipBannerEl.hidden = true;
      }, 5000);
      await advanceAfterError();
    }

    function playVideo(videoId, { background = false } = {}) {
      idleEl.hidden = true;
      ytWrapEl.hidden = false;

      // Leaving a background track mid-play; remember where to pick it back up.
      if (currentIsBackground && currentVideoId && ytReady) {
        backgroundResumeAt.set(currentVideoId, ytPlayer.getCurrentTime());
      }

      const startSeconds = background ? (backgroundResumeAt.get(videoId) ?? 0) : 0;
      currentVideoId = videoId;
      currentIsBackground = background;

      if (ytReady) {
        ytPlayer.loadVideoById({ videoId, startSeconds });
      } else {
        pendingVideo = { videoId, startSeconds };
      }
    }

    function showIdle() {
      ytWrapEl.hidden = true;
      idleEl.hidden = false;
    }

    async function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        await advance();
      }
    }

    function renderSideQueue(queued) {
      sideQueueEl.innerHTML = "";
      if (queued.length === 0) {
        sideEmptyEl.hidden = false;
        return;
      }
      sideEmptyEl.hidden = true;
      queued.forEach((entry, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="position">${i + 1}</span><span>${escapeHtml(entry.songTitle)}</span>`;
        sideQueueEl.appendChild(li);
      });
    }

    function applyNowPlaying(nowPlaying) {
      if (nowPlaying) {
        playVideo(nowPlaying.songRef);
      } else {
        showIdle();
      }
    }

    function applyAdvanceResult(result) {
      if (result.type === "request") {
        playVideo(result.entry.songRef);
      } else if (result.type === "playlist") {
        playVideo(result.track.song_ref, { background: true });
      } else {
        showIdle();
      }
    }

    async function advance() {
      const res = await fetch(`/player/${token}/advance`, { method: "POST" });
      applyAdvanceResult(await res.json());
    }

    async function advanceAfterError() {
      const res = await fetch(`/player/${token}/error`, { method: "POST" });
      applyAdvanceResult(await res.json());
    }

    async function loadInitialState() {
      const res = await fetch(`/player/${token}/state`);
      const state = await res.json();
      renderSideQueue(state.queued);
      if (state.nowPlaying) {
        applyNowPlaying(state.nowPlaying);
      } else {
        // Nothing has played yet; kick off playback.
        await advance();
      }
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}/?player=${encodeURIComponent(token)}`);
      ws.addEventListener("open", () => {
        connectionBannerEl.hidden = true;
      });
      ws.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "queue-state") {
          renderSideQueue(message.queued);
          // A table skipped its own now-playing song.
          if (message.skipTo) {
            applyAdvanceResult(message.skipTo);
          }
        }
      });
      ws.addEventListener("close", () => {
        connectionBannerEl.hidden = false;
        setTimeout(connectSocket, 2000);
      });
    }

    loadInitialState();
    connectSocket();
  </script>
</body>
</html>
