<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05060a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>karaoke-queue player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Beats any element-specific display rule below. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    background: #05060a;
    color: #e8ecf1;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #player-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #yt-player-wrap { flex: 1; background: #000; min-height: 0; }
  #yt-player { width: 100%; height: 100%; }
  #idle-message {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #6b7280;
    text-align: center;
    padding: 20px;
  }
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #12141a;
    padding: 20px;
    overflow-y: auto;
  }
  #sidebar h2 { font-size: 0.95rem; color: #9aa3b2; margin: 0 0 12px; }

  /* Narrow/portrait screens (phones): stack instead of a squeezed sidebar. */
  @media (max-width: 700px) {
    body { flex-direction: column; height: 100vh; height: 100dvh; }
    #player-column { flex: none; }
    #yt-player-wrap, #idle-message { aspect-ratio: 16 / 9; flex: none; font-size: 1.4rem; }
    #sidebar { width: 100%; flex: 1; min-height: 0; }
  }
  ol#side-queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ol#side-queue li {
    background: #1a1d24;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.9rem;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  ol#side-queue li .position { color: #6ee7ff; font-weight: 700; }
  #connection-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #ff6e6e;
    color: #2a0505;
    font-weight: 700;
    text-align: center;
    padding: 6px;
    font-size: 0.9rem;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="connection-banner" hidden>Reconnecting to the server…</div>
  <div id="player-column">
    <div id="idle-message" hidden>Waiting for requests...</div>
    <div id="yt-player-wrap" hidden><div id="yt-player"></div></div>
  </div>
  <div id="sidebar">
    <h2>Up next</h2>
    <ol id="side-queue"></ol>
    <p id="side-empty" hidden style="color:#6b7280;font-size:0.9rem;">Nothing waiting.</p>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module">
    const token = location.pathname.split("/").filter(Boolean)[1];
    const connectionBannerEl = document.getElementById("connection-banner");
    const ytWrapEl = document.getElementById("yt-player-wrap");
    const idleEl = document.getElementById("idle-message");
    const sideQueueEl = document.getElementById("side-queue");
    const sideEmptyEl = document.getElementById("side-empty");

    let ytPlayer = null;
    let ytReady = false;
    let pendingVideo = null;
    let currentVideoId = null;
    let currentIsBackground = false;
    const backgroundResumeAt = new Map();

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingVideo) {
              ytPlayer.loadVideoById(pendingVideo);
              pendingVideo = null;
            }
          },
          onStateChange: onPlayerStateChange,
          // Some videos block embedding; skip instead of getting stuck.
          onError: onPlayerError,
        },
      });
    };

    async function onPlayerError() {
      await advance();
    }

    function playVideo(videoId, { background = false } = {}) {
      idleEl.hidden = true;
      ytWrapEl.hidden = false;

      // Leaving a background track mid-play; remember where to pick it back up.
      if (currentIsBackground && currentVideoId && ytReady) {
        backgroundResumeAt.set(currentVideoId, ytPlayer.getCurrentTime());
      }

      const startSeconds = background ? (backgroundResumeAt.get(videoId) ?? 0) : 0;
      currentVideoId = videoId;
      currentIsBackground = background;

      if (ytReady) {
        ytPlayer.loadVideoById({ videoId, startSeconds });
      } else {
        pendingVideo = { videoId, startSeconds };
      }
    }

    function showIdle() {
      ytWrapEl.hidden = true;
      idleEl.hidden = false;
    }

    async function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        await advance();
      }
    }

    function renderSideQueue(queued) {
      sideQueueEl.innerHTML = "";
      if (queued.length === 0) {
        sideEmptyEl.hidden = false;
        return;
      }
      sideEmptyEl.hidden = true;
      queued.forEach((entry, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="position">${i + 1}</span><span>${escapeHtml(entry.songTitle)}</span>`;
        sideQueueEl.appendChild(li);
      });
    }

    function applyNowPlaying(nowPlaying) {
      if (nowPlaying) {
        playVideo(nowPlaying.songRef);
      } else {
        showIdle();
      }
    }

    function applyAdvanceResult(result) {
      if (result.type === "request") {
        playVideo(result.entry.songRef);
      } else if (result.type === "playlist") {
        playVideo(result.track.song_ref, { background: true });
      } else {
        showIdle();
      }
    }

    async function advance() {
      const res = await fetch(`/player/${token}/advance`, { method: "POST" });
      applyAdvanceResult(await res.json());
    }

    async function loadInitialState() {
      const res = await fetch(`/player/${token}/state`);
      const state = await res.json();
      renderSideQueue(state.queued);
      if (state.nowPlaying) {
        applyNowPlaying(state.nowPlaying);
      } else {
        // Nothing has played yet; kick off playback.
        await advance();
      }
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.addEventListener("open", () => {
        connectionBannerEl.hidden = true;
      });
      ws.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "queue-state") {
          renderSideQueue(message.queued);
          // A table skipped its own now-playing song.
          if (message.skipTo) {
            applyAdvanceResult(message.skipTo);
          }
        }
      });
      ws.addEventListener("close", () => {
        connectionBannerEl.hidden = false;
        setTimeout(connectSocket, 2000);
      });
    }

    loadInitialState();
    connectSocket();
  </script>
</body>
</html>
